name: Fork Sync Dev

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: 'Specific upstream transports/v* tag to release, for example transports/v1.5.11'
        required: false
        type: string
      dry_run:
        description: 'Run without pushing patched-dev, tags, or dispatching release workflows'
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  issues: write
  packages: read

concurrency:
  group: fork-sync-dev
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO }}
      UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH }}
      PATCH_BRANCH: ${{ vars.PATCH_BRANCH }}
      GENERATED_BRANCH: ${{ vars.GENERATED_BRANCH }}
      GHCR_REGISTRY: ${{ vars.GHCR_REGISTRY }}
      GHCR_IMAGE_NAME: ${{ vars.GHCR_IMAGE_NAME }}
      FORK_SYNC_STATE_FILE: .fork-upstream-sync.env
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      UPSTREAM_TAG: ${{ inputs.upstream_tag }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git identity
        run: |
          git config user.name "fork-sync-dev[bot]"
          git config user.email "fork-sync-dev[bot]@users.noreply.github.com"

      - name: Sync patched-dev and release tags
        run: bash ./.github/workflows/scripts/fork-sync-dev.sh
