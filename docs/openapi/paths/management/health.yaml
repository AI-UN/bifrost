health:
  get:
    operationId: getHealth
    summary: Health check
    description: |
      Returns the health status of the Bifrost server. Checks connectivity to config store,
      log store, and vector store if configured.
      Unauthenticated by design - `/health` is in the auth middleware's system whitelist.
    tags:
      - Health
    # Public: system-whitelisted in AuthMiddleware.APIMiddleware().
    security: []
    responses:
      '200':
        description: Server is healthy
        content:
          application/json:
            schema:
              $ref: '../../schemas/management/health.yaml#/HealthResponse'
      '503':
        description: Service unavailable
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'

ready:
  get:
    operationId: getReadiness
    summary: Readiness check
    description: Returns ready only after the node has applied its initial shared configuration snapshot. The configuration-sync readiness gate is a fork-specific extension.
    tags:
      - Health
    security: []
    responses:
      '200':
        description: Node is ready to receive traffic
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  example: ok
      '503':
        description: Initial configuration synchronization is still pending
        content:
          application/json:
            schema:
              $ref: '../../schemas/inference/common.yaml#/BifrostError'
